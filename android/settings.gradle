rootProject.name = 'codebeacon'

include ':app'

// Flutter 插件加载器：由 flutter tool 生成，负责注入 Flutter 引擎依赖
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    // 未配置 flutter.sdk 时抛出明确错误，比后续报一堆奇怪错要好
    throw new GradleException(
        "Flutter SDK 未找到。请在 android/local.properties 中配置：\n" +
        "  flutter.sdk=/path/to/flutter"
    )
}

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"